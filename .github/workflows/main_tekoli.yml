# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - tekoli

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6A2AC09451A84C618B7944A1FDCE595F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_454E1B4C8C0F4967A9807ABEFDC29119 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_39D363DA167C495CB35D72C1CF87AA5B }}

      - name: Start the new server on App Service
        run: |
          RG=$(az webapp list --query "[?name=='tekoli'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then
            echo "App Service tekoli was not found in this subscription."
            exit 1
          fi
          az webapp config set --name tekoli --resource-group "$RG" --startup-file "npm start"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tekoli'
          slot-name: 'Production'
          package: .
          